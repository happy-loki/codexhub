name: release-linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            desktop-file-utils \
            dpkg-dev \
            libclang-dev \
            libexpat1-dev \
            libfuse2 \
            libgdk-pixbuf2.0-bin \
            libglib2.0-bin \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-bin \
            libgtk-3-dev \
            libjpeg-dev \
            libpng-dev \
            librsvg2-dev \
            libtiff-dev \
            libxkbcommon-dev \
            patchelf \
            pkg-config \
            wget

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Reset wxWidgets CMake Cache
        run: |
          set -euo pipefail
          rm -rf target/release/wxwidgets_cmake_build
          rm -rf target/release/wxdragon_sys_cmake_build

      - name: Build Release
        run: |
          set -euo pipefail
          cargo build --release --features gui --bin codexhub
          strip target/release/codexhub

      - name: Package Tarball
        run: |
          set -euo pipefail
          DIST_ROOT="target/dist"
          PACKAGE_DIR="$DIST_ROOT/CodexHub Linux x86_64"
          rm -rf "$DIST_ROOT"
          mkdir -p \
            "$PACKAGE_DIR/bin" \
            "$PACKAGE_DIR/share/applications" \
            "$PACKAGE_DIR/share/icons/hicolor/256x256/apps"

          cp target/release/codexhub "$PACKAGE_DIR/bin/codexhub"
          cp packaging/linux/codexhub.desktop "$PACKAGE_DIR/share/applications/codexhub.desktop"
          cp packaging/icons/dolphin-rounded-256.png "$PACKAGE_DIR/share/icons/hicolor/256x256/apps/codexhub.png"
          cp README.md README.en.md "$PACKAGE_DIR/"
          if [ -f config.example.toml ]; then
            cp config.example.toml "$PACKAGE_DIR/"
          fi

          tar -C "$DIST_ROOT" -czf "$DIST_ROOT/CodexHub Linux x86_64.tar.gz" "CodexHub Linux x86_64"

      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DIST_ROOT="target/dist"
          APPDIR="$DIST_ROOT/AppDir"
          rm -rf "$APPDIR"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp target/release/codexhub "$APPDIR/usr/bin/codexhub"
          cp packaging/linux/codexhub.desktop "$APPDIR/usr/share/applications/codexhub.desktop"
          cp packaging/icons/dolphin-rounded-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/codexhub.png"
          desktop-file-validate "$APPDIR/usr/share/applications/codexhub.desktop"

          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          export LINUXDEPLOY_OUTPUT_VERSION="${VERSION#v}"
          ./linuxdeploy-x86_64.AppImage \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/codexhub" \
            --desktop-file "$APPDIR/usr/share/applications/codexhub.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/codexhub.png" \
            --plugin gtk \
            --output appimage

          rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          APPIMAGE="$(find . -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          mv "$APPIMAGE" "$DIST_ROOT/CodexHub Linux x86_64.AppImage"

      - name: Write Linux Update Metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          dist = Path("target/dist")
          appimage = dist / "CodexHub Linux x86_64.AppImage"
          tarball = dist / "CodexHub Linux x86_64.tar.gz"
          release_tag = os.environ["RELEASE_TAG"]
          repository = os.environ["RELEASE_REPOSITORY"]
          release_url = f"https://github.com/{repository}/releases/tag/{release_tag}"
          download_base_url = f"https://github.com/{repository}/releases/download/{release_tag}"
          update_notes = Path("UPDATE_NOTES.md").read_text(encoding="utf-8").strip()

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest = {
              "version": release_tag,
              "releaseUrl": release_url,
              "notes": update_notes,
              "assets": {
                  "linux-x86_64": {
                      "type": "appimage",
                      "url": f"{download_base_url}/{quote(appimage.name)}",
                      "sha256": sha256(appimage),
                      "size": appimage.stat().st_size,
                  },
                  "linux-tar-x86_64": {
                      "type": "tar.gz",
                      "url": f"{download_base_url}/{quote(tarball.name)}",
                      "sha256": sha256(tarball),
                      "size": tarball.stat().st_size,
                  },
              },
          }
          (dist / "latest-linux.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexHub-Linux
          path: |
            target/dist/CodexHub Linux x86_64.AppImage
            target/dist/CodexHub Linux x86_64.tar.gz
            target/dist/latest-linux.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          # macOS publishes last and promotes the release only after every
          # platform-specific update manifest is available.
          make_latest: false
          files: |
            target/dist/CodexHub Linux x86_64.AppImage
            target/dist/CodexHub Linux x86_64.tar.gz
            target/dist/latest-linux.json
